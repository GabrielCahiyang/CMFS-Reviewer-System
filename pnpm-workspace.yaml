allowBuilds:
  '@firebase/util': false
  esbuild: true
  protobufjs: false
  re2: false
  sharp: true
  unrs-resolver: true
# Keep host-native binaries for builds and Linux ARM64 binaries for Lambda.
supportedArchitectures:
  os:
    - current
    - linux
  cpu:
    - current
    - arm64
  libc:
    - current
    - glibc
patchedDependencies:
  jwks-rsa@4.1.0: patches/jwks-rsa@4.1.0.patch
